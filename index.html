<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經歷史・萬能呈現框架 (v4.49 色段全亮與標頭修正版)</title>
    <style>
        @page { size: A4 portrait; margin: 4mm; }
        body { font-family: "Noto Sans TC", Arial, sans-serif; background: #fffdf9; color: #2c3e50; margin: 0; padding: 8px; font-size: 10pt; box-sizing: border-box; }
        .notebook-container { max-width: 1550px; margin: 0 auto; border: 2px dashed #d4ac0d; padding: 12px 8px; background: #fffbf0; border-radius: 6px; box-sizing: border-box; }
        
        h1 { text-align: center; font-size: 14pt; margin: 0 0 2px 0; background: #f9e79f; color: #7d6608; padding: 3px; border-radius: 4px; }
        p.subtitle { text-align: center; font-size: 10pt; margin: 0 0 10px 0; color: #7f8c8d; }

        .main-layout { display: grid; grid-template-columns: 420px 100px 420px; justify-content: center; gap: 20px; align-items: start; position: relative; }
        
        .column-header { text-align: center; font-weight: bold; padding: 6px; border-radius: 3px; font-size: 11pt; color: white; margin-bottom: 6px; }
        .left-header { background: #e74c3c; }
        .right-header { background: #27ae60; }

        .cards-side { display: flex; flex-direction: column; gap: 6px; position: relative; }

        .king-card {
            background: #ffffff; border: 1px solid #bdc3c7; border-radius: 3px;
            padding: 6px 8px; font-size: 10pt; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            line-height: 1.35; position: relative; cursor: pointer;
            transition: all 0.2s ease;
        }
        .side-left-card { border-left: 4px solid #e74c3c; }
        .side-right-card { border-left: 4px solid #27ae60; }
        
        .king-card.tier-good { background: #eafaf1; }
        .king-card.tier-bad { background: #fdfefe; }
        .king-card.tier-evil { background: #fadbd8; }
        .king-card.tier-special { background: #fef9e7; }
        
        .king-card.tier-collapse { background: #4a1512; color: #ffffff !important; }
        .king-card.tier-collapse .king-name { color: #fce4ec !important; border-bottom: 1px solid #8a3b38; }
        .king-card.tier-collapse .meta-row, 
        .king-card.tier-collapse .detail-row, 
        .king-card.tier-collapse .female-info { color: #f5c6cb !important; }
        .king-card.tier-collapse .prophet-row { color: #ffadad !important; border-top: 1px dashed #8a3b38; }
        .king-card.tier-collapse .prophet { color: #ffebee !important; }

        /* 主選中狀態：卡片與色段整條高亮 */
        .king-card.highlight-main {
            background: #ffeb99 !important; border: 2px solid #b9770e !important;
            border-left: 6px solid #b9770e !important; box-shadow: 0 0 12px rgba(211, 84, 0, 0.95);
            transform: scale(1.015); z-index: 25; color: #111111 !important;
        }
        .king-card.highlight-main .king-name,
        .king-card.highlight-main .meta-row,
        .king-card.highlight-main .detail-row,
        .king-card.highlight-main .prophet-row,
        .king-card.highlight-main .prophet,
        .king-card.highlight-main span { color: #111111 !important; }

        /* 重疊對應狀態 */
        .king-card.highlight-overlap {
            background: #fef9e7 !important; border: 2px solid #f39c12 !important;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.8); z-index: 20; color: #111111 !important;
        }
        .king-card.highlight-overlap .king-name,
        .king-card.highlight-overlap .meta-row,
        .king-card.highlight-overlap .detail-row,
        .king-card.highlight-overlap .prophet-row,
        .king-card.highlight-overlap .prophet,
        .king-card.highlight-overlap span { color: #111111 !important; }

        .king-name { font-weight: bold; color: #2c3e50; font-size: 11pt; border-bottom: 1px solid #ecf0f1; padding-bottom: 2px; margin-bottom: 2px; }
        .meta-row { white-space: normal; word-break: break-all; color: #34495e; font-size: 9.5pt; margin: 2px 0; line-height: 1.3; }
        .prophet-row { white-space: normal; word-break: break-all; color: #78281f; font-size: 11pt; font-weight: bold; margin: 3px 0; padding-top: 2px; border-top: 1px dashed #fadbd8; }
        .prophet { font-weight: bold; color: #922b21; }
        .female-info { color: #566573; font-weight: normal; }
        .detail-row { color: #566573; margin-top: 3px; font-size: 10pt; border-top: 1px dotted #f2f4f4; padding-top: 3px; }

        .timeline-center { 
            display: flex; justify-content: center; background: #fff; border: 1px solid #bdc3c7; 
            padding: 4px 4px; border-radius: 4px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
            position: relative; align-self: flex-start;
        }
        .bar-track-container { display: flex; gap: 6px; width: 100%; justify-content: center; position: relative; height: 100%; }
        .bar-track { width: 24px; background: #f4f6f7; border: 1px solid #95a5a6; display: flex; flex-direction: column; position: relative; }
        
        .bar-segment { 
            width: 100%; border-bottom: 1px solid rgba(0,0,0,0.2); box-sizing: border-box; 
            transition: all 0.2s ease; cursor: pointer; position: absolute; left: 0; right: 0;
        }
        
        /* 整個色段主高亮：金黃色填滿 + 強烈外發光 */
        .bar-segment.highlight-main { 
            background: #ffcc00 !important; 
            border: 2px solid #b9770e !important; 
            box-shadow: 0 0 12px #d35400, inset 0 0 6px #fff !important; 
            z-index: 25; 
            filter: none !important; 
        }
        
        /* 整個色段重疊高亮：柔和亮黃色填滿 */
        .bar-segment.highlight-overlap { 
            background: #ffe066 !important; 
            border: 2px solid #f39c12 !important; 
            box-shadow: 0 0 8px #f1c40f !important; 
            z-index: 20; 
            filter: none !important; 
        }

        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        @media screen and (max-width: 1000px) {
            body { padding: 4px; }
            .notebook-container { padding: 8px 4px; }
            .main-layout { grid-template-columns: 1fr; gap: 15px; padding: 0 8px; }
            .timeline-center { order: -1; margin-bottom: 10px; align-self: center; }
            .svg-overlay { display: none; }
        }
    </style>
</head>
<body>

<div class="notebook-container">
    <h1 id="appTitle">載入中...</h1>
    <p class="subtitle" id="appSubtitle">✨ v4.49 色段全亮與標頭修正版</p>

    <div class="main-layout" id="layoutContainer">
        <svg class="svg-overlay" id="linkSvg"></svg>

        <div>
            <div class="column-header left-header" id="leftHeaderTitle">左側直欄</div>
            <div class="cards-side" id="leftCardsContainer"></div>
        </div>

        <div class="timeline-center" id="timelineCenter">
            <div class="bar-track-container">
                <div class="bar-track" id="leftTrack"></div>
                <div class="bar-track" id="rightTrack"></div>
            </div>
        </div>

        <div>
            <div class="column-header right-header" id="rightHeaderTitle">右側直欄</div>
            <div class="cards-side" id="rightCardsContainer"></div>
        </div>
    </div>
</div>

<script>
    function parseCSV(text) {
        let lines = text.trim().split('\n');
        let headers = lines[0].split(',').map(h => h.trim());
        let result = [];

        for (let i = 1; i < lines.length; i++) {
            let row = [];
            let inQuotes = false;
            let currentField = '';
            let line = lines[i];

            for (let c = 0; c < line.length; c++) {
                let char = line[c];
                if (char === '"' && (c === 0 || line[c-1] !== '\\')) {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentField.trim().replace(/^["']|["']$/g, ''));
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            row.push(currentField.trim().replace(/^["']|["']$/g, ''));

            let obj = {};
            for (let j = 0; j < headers.length; j++) {
                obj[headers[j]] = row[j] !== undefined ? row[j] : '';
            }
            result.push(obj);
        }
        return result;
    }

    async function initFramework() {
        try {
            const res = await fetch('data_king_cards.csv');
            const csvText = await res.text();
            const rows = parseCSV(csvText);

            const metaRows = rows.filter(r => r.type === 'meta');
            const dataRows = rows.filter(r => r.type === 'data' || !r.type);

            let mainTitle = "聖經歷史・萬能呈現框架 (v4.49)";
            let mainSub = "✨ 具備色段全亮與標頭同步版";
            let leftTitle = "北國以色列 (19王全展開)";
            let rightTitle = "聯合王國 + 南國猶大 (統治者與亡國)";

            // 修正：meta 行的值實際上存在於 `name` 欄位中
            metaRows.forEach(m => {
                let val = m.name || m.value;
                if (m.key === 'app_title' && val && val !== '.') mainTitle = val;
                if (m.key === 'app_subtitle' && val && val !== '.') mainSub = val;
                if (m.key === 'left_header' && val && val !== '.') leftTitle = val;
                if (m.key === 'right_header' && val && val !== '.') rightTitle = val;
            });

            document.title = mainTitle;
            document.getElementById('appTitle').innerText = mainTitle;
            document.getElementById('appSubtitle').innerText = mainSub;
            document.getElementById('leftHeaderTitle').innerText = leftTitle;
            document.getElementById('rightHeaderTitle').innerText = rightTitle;

            const leftData = dataRows.filter(r => r.layout_side === 'left').sort((a,b) => parseInt(a.layout_order) - parseInt(b.layout_order));
            const rightData = dataRows.filter(r => r.layout_side === 'right').sort((a,b) => parseInt(a.layout_order) - parseInt(b.layout_order));

            let allYears = [];
            dataRows.forEach(item => {
                let s = parseInt(item.start_year);
                let e = parseInt(item.end_year);
                if (!isNaN(s)) allYears.push(s);
                if (!isNaN(e)) allYears.push(e);
            });

            const TOP_BASE_YEAR = allYears.length > 0 ? Math.max(...allYears) : 1050;
            const BOTTOM_TARGET_YEAR = allYears.length > 0 ? Math.min(...allYears) : 516;
            const TOTAL_YEARS = TOP_BASE_YEAR - BOTTOM_TARGET_YEAR;

            const leftCardsEl = document.getElementById('leftCardsContainer');
            const rightCardsEl = document.getElementById('rightCardsContainer');
            const leftTrackEl = document.getElementById('leftTrack');
            const rightTrackEl = document.getElementById('rightTrack');
            const timelineCenterEl = document.getElementById('timelineCenter');

            renderCards(leftData, 'left', leftCardsEl);
            renderCards(rightData, 'right', rightCardsEl);

            const leftCardsHeight = leftCardsEl.offsetHeight;
            const rightCardsHeight = rightCardsEl.offsetHeight;
            const maxCardsHeight = Math.max(leftCardsHeight, rightCardsHeight, 800);

            leftTrackEl.style.height = `${maxCardsHeight}px`;
            rightTrackEl.style.height = `${maxCardsHeight}px`;
            timelineCenterEl.style.height = `${maxCardsHeight}px`;

            const basePxPerYear = maxCardsHeight / TOTAL_YEARS;

            renderTrackWithGlobalScale(leftData, 'left', leftTrackEl, basePxPerYear, TOP_BASE_YEAR);
            renderTrackWithGlobalScale(rightData, 'right', rightTrackEl, basePxPerYear, TOP_BASE_YEAR);

            setTimeout(() => {
                applyGroupCenterAlignment(leftCardsEl, leftCardsHeight, maxCardsHeight);
                applyGroupCenterAlignment(rightCardsEl, rightCardsHeight, maxCardsHeight);
                drawLines();
            }, 60);

            initInteractive();
        } catch (e) {
            console.error("初始化失敗：", e);
        }
    }

    function renderCards(data, sideName, container) {
        container.innerHTML = '';
        data.forEach((item) => {
            const uniqueId = `${sideName}-${item.layout_order}`;
            const card = document.createElement('div');
            card.className = `king-card side-${sideName}-card tier-${item.justice_tier || 'default'}`;
            card.setAttribute('data-side', sideName);
            card.setAttribute('data-id', uniqueId);
            
            const rawS = parseInt(item.start_year);
            const rawE = parseInt(item.end_year);
            const cardStart = !isNaN(rawS) && !isNaN(rawE) ? Math.max(rawS, rawE) : item.start_year;
            const cardEnd = !isNaN(rawS) && !isNaN(rawE) ? Math.min(rawS, rawE) : item.end_year;

            card.setAttribute('data-start', cardStart);
            card.setAttribute('data-end', cardEnd);

            let fatherHtml = item.father ? `👨 父親：${item.father}` : '';
            let femaleHtml = item.female_info ? `<span class="female-info">${item.female_info}</span>` : '';
            let middleParts = [fatherHtml, femaleHtml].filter(p => p !== '').join(' | ');
            let middleRowHtml = middleParts ? `<div class="meta-row">${middleParts}</div>` : '';
            let prophetRowHtml = item.prophet ? `<div class="prophet-row">📜 先知：<span class="prophet">${item.prophet}</span></div>` : '';

            card.innerHTML = `
                <div class="king-name">${item.name} (${item.reign_info}${item.start_year ? ', ' + cardStart + '-' + cardEnd + ' BC' : ''})</div>
                <div class="meta-row">✨ 特質：<span>${item.title_tag}</span></div>
                ${middleRowHtml}
                ${prophetRowHtml}
                <div class="detail-row"><b>核心事件</b>：${item.summary}</div>
            `;
            container.appendChild(card);
        });
    }

    function renderTrackWithGlobalScale(data, sideName, trackContainer, basePxPerYear, topBaseYear) {
        trackContainer.innerHTML = '';

        data.forEach((item) => {
            const rawS = parseInt(item.start_year);
            const rawE = parseInt(item.end_year);
            if (isNaN(rawS) || isNaN(rawE)) return;

            const start = Math.max(rawS, rawE);
            const end = Math.min(rawS, rawE);

            const topOffset = (topBaseYear - start) * basePxPerYear;
            const duration = Math.abs(start - end);
            const height = Math.max(duration * basePxPerYear, 4);

            const seg = document.createElement('div');
            seg.className = 'bar-segment';
            seg.setAttribute('data-side', sideName);
            seg.setAttribute('data-id', `${sideName}-${item.layout_order}`);
            seg.setAttribute('data-start', start);
            seg.setAttribute('data-end', end);

            seg.style.top = `${topOffset}px`;
            seg.style.height = `${height}px`;

            const tier = item.justice_tier;
            if(tier === 'good') seg.style.background = 'linear-gradient(to bottom, #52be80, #27ae60)';
            else if(tier === 'bad') seg.style.background = 'linear-gradient(to bottom, #d98880, #c0392b)';
            else if(tier === 'evil') seg.style.background = '#f5b7b1';
            else if(tier === 'special') seg.style.background = 'linear-gradient(to bottom, #f9e79f, #f1c40f)';
            else if(tier === 'collapse') seg.style.background = '#4a1512';
            else seg.style.background = sideName === 'left' ? '#e74c3c' : '#27ae60';

            trackContainer.appendChild(seg);
        });
    }

    function applyGroupCenterAlignment(cardsContainer, sideCardsHeight, targetHeight) {
        const heightDiff = targetHeight - sideCardsHeight;
        const overallOffset = heightDiff / 2;

        if (Math.abs(overallOffset) > 1) {
            cardsContainer.style.transform = `translateY(${overallOffset}px)`;
        }
    }

    function drawLines(activeSide = null, activeId = null, overlapSet = new Set()) {
        const container = document.getElementById('layoutContainer').getBoundingClientRect();
        const svg = document.getElementById('linkSvg');
        
        while (svg.childNodes.length > 0) {
            svg.removeChild(svg.lastChild);
        }

        if (window.innerWidth <= 1000) return;

        ['left', 'right'].forEach(side => {
            document.querySelectorAll(`#${side}CardsContainer .king-card`).forEach(card => {
                const id = card.getAttribute('data-id');
                const segment = document.querySelector(`#${side}Track .bar-segment[data-side="${side}"][data-id="${id}"]`);
                if (segment) {
                    const cardRect = card.getBoundingClientRect();
                    const segRect = segment.getBoundingClientRect();

                    const x1 = side === 'left' ? (cardRect.right - container.left) : (cardRect.left - container.left);
                    const y1 = cardRect.top + cardRect.height / 2 - container.top;
                    const x2 = side === 'left' ? (segRect.left - container.left) : (segRect.right - container.left);
                    const y2 = segRect.top + segRect.height / 2 - container.top;

                    const isMain = (activeSide === side && activeId === id);
                    const isOverlap = overlapSet.has(id);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
                    
                    if (isMain) {
                        path.setAttribute('stroke', '#b9770e');
                        path.setAttribute('stroke-width', '3');
                        path.setAttribute('opacity', '1');
                    } else if (isOverlap) {
                        path.setAttribute('stroke', '#f39c12');
                        path.setAttribute('stroke-width', '2');
                        path.setAttribute('opacity', '0.95');
                    } else {
                        path.setAttribute('stroke', side === 'left' ? '#e74c3c' : '#27ae60');
                        path.setAttribute('stroke-width', '1.2');
                        path.setAttribute('opacity', '0.8');
                    }
                    svg.appendChild(path);
                }
            });
        });
    }

    function triggerHighlight(start, end, mainSide, mainId) {
        if (isNaN(start) || isNaN(end)) return;
        document.querySelectorAll('.highlight-main, .highlight-overlap').forEach(el => {
            el.classList.remove('highlight-main', 'highlight-overlap');
        });

        const mainCard = document.querySelector(`.king-card[data-side="${mainSide}"][data-id="${mainId}"]`);
        const mainSeg = document.querySelector(`.bar-segment[data-side="${mainSide}"][data-id="${mainId}"]`);
        if (mainCard) mainCard.classList.add('highlight-main');
        if (mainSeg) mainSeg.classList.add('highlight-main');

        const overlapSet = new Set();
        document.querySelectorAll('.king-card').forEach(card => {
            const cSide = card.getAttribute('data-side');
            const cId = card.getAttribute('data-id');
            if (cSide === mainSide) return;

            const cStart = parseInt(card.getAttribute('data-start'));
            const cEnd = parseInt(card.getAttribute('data-end'));
            if (isNaN(cStart) || isNaN(cEnd)) return;

            const maxEnd = Math.max(end, cEnd);
            const minStart = Math.min(start, cStart);

            if (maxEnd <= minStart) {
                card.classList.add('highlight-overlap');
                const seg = document.querySelector(`.bar-segment[data-side="${cSide}"][data-id="${cId}"]`);
                if (seg) seg.classList.add('highlight-overlap');
                overlapSet.add(cId);
            }
        });

        drawLines(mainSide, mainId, overlapSet);
    }

    function initInteractive() {
        document.querySelectorAll('.king-card, .bar-segment').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const start = parseInt(el.getAttribute('data-start'));
                const end = parseInt(el.getAttribute('data-end'));
                const side = el.getAttribute('data-side');
                const id = el.getAttribute('data-id');
                triggerHighlight(start, end, side, id);
            });
        });
    }

    window.addEventListener('load', () => initFramework());
    window.addEventListener('resize', () => drawLines());
</script>

</body>
</html>
