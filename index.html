<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>聖經歷史・萬能呈現框架 (v4.10 純CSV驅動版)</title>
    <style>
        @page { size: A4 portrait; margin: 4mm; }
        body { font-family: "Noto Sans TC", Arial, sans-serif; background: #fffdf9; color: #2c3e50; margin: 0; padding: 4px; font-size: 10pt; }
        .notebook-container { max-width: 1400px; margin: 0 auto; border: 2px dashed #d4ac0d; padding: 8px; background: #fffbf0; border-radius: 6px; }
        
        h1 { text-align: center; font-size: 14pt; margin: 0 0 2px 0; background: #f9e79f; color: #7d6608; padding: 3px; border-radius: 4px; }
        p.subtitle { text-align: center; font-size: 10pt; margin: 0 0 6px 0; color: #7f8c8d; }

        .main-layout { display: grid; grid-template-columns: 400px 60px 400px; justify-content: center; gap: 40px; align-items: start; position: relative; }
        
        .column-header { text-align: center; font-weight: bold; padding: 6px; border-radius: 3px; font-size: 11pt; color: white; margin-bottom: 6px; }
        .left-header { background: #e74c3c; }
        .right-header { background: #27ae60; }

        .cards-side { display: flex; flex-direction: column; gap: 6px; position: relative; }

        .king-card {
            background: #ffffff; border: 1px solid #bdc3c7; border-radius: 3px;
            padding: 6px 8px; font-size: 10pt; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            line-height: 1.35; position: relative; cursor: pointer;
            transition: all 0.2s ease;
        }
        .side-left-card { border-left: 4px solid #e74c3c; }
        .side-right-card { border-left: 4px solid #27ae60; }
        
        .king-card.tier-good { background: #eafaf1; }
        .king-card.tier-bad { background: #fdfefe; }
        .king-card.tier-evil { background: #fadbd8; }
        .king-card.tier-special { background: #fef9e7; }
        .king-card.tier-collapse { background: #641e16; color: #ffffff !important; }
        .king-card.tier-collapse .king-name, .king-card.tier-collapse .detail-row, .king-card.tier-collapse .meta-row, .king-card.tier-collapse .prophet-row { color: #ffffff !important; }

        .king-card.highlight-main {
            background: #ffeb99 !important;
            border: 2px solid #b9770e !important;
            border-left: 6px solid #b9770e !important;
            box-shadow: 0 0 12px rgba(211, 84, 0, 0.95);
            transform: scale(1.015);
            z-index: 25;
            color: #111111 !important;
        }
        .king-card.highlight-main *, .king-card.highlight-overlap * { color: #111111 !important; }
        .king-card.highlight-overlap {
            background: #fef9e7 !important;
            border: 2px solid #f39c12 !important;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.8);
            z-index: 20;
            color: #111111 !important;
        }

        .king-name { font-weight: bold; color: #2c3e50; font-size: 11pt; border-bottom: 1px solid #ecf0f1; padding-bottom: 2px; margin-bottom: 2px; }
        .meta-row { white-space: normal; word-break: break-all; color: #34495e; font-size: 9.5pt; margin: 2px 0; line-height: 1.3; }
        .prophet-row { white-space: normal; word-break: break-all; color: #78281f; font-size: 11pt; font-weight: bold; margin: 3px 0; padding-top: 2px; border-top: 1px dashed #fadbd8; }
        .prophet { font-weight: bold; color: #922b21; }
        .tier-collapse .prophet { color: #f9e79f !important; }
        .female-info { color: #566573; font-weight: normal; }
        .detail-row { color: #566573; margin-top: 3px; font-size: 10pt; border-top: 1px dotted #f2f4f4; padding-top: 3px; }

        .timeline-center { 
            display: flex; justify-content: center; background: #fff; border: 1px solid #bdc3c7; 
            padding: 4px 2px; border-radius: 4px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
            position: relative; align-self: flex-start; margin-top: 35px;
        }
        .bar-track-container { display: flex; gap: 4px; width: 100%; justify-content: center; }
        .bar-track { width: 20px; background: #f4f6f7; border: 1px solid #95a5a6; display: flex; flex-direction: column; position: relative; }
        
        .bar-segment { 
            width: 100%; border-bottom: 1px solid rgba(0,0,0,0.2); box-sizing: border-box; 
            transition: all 0.2s ease; cursor: pointer; position: absolute; left: 0; right: 0;
        }
        .bar-segment.highlight-main { border: 2px solid #b9770e !important; filter: brightness(1.4); box-shadow: 0 0 10px #d35400; z-index: 25; }
        .bar-segment.highlight-overlap { border: 2px solid #f39c12 !important; filter: brightness(1.25); box-shadow: 0 0 6px #f1c40f; z-index: 20; }

        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

<div class="notebook-container">
    <h1 id="appTitle">載入中...</h1>
    <p class="subtitle" id="appSubtitle">✨ 正在解析 CSV 呈現框架設定</p>

    <div class="main-layout" id="layoutContainer">
        <svg class="svg-overlay" id="linkSvg"></svg>

        <!-- 左側直欄 -->
        <div>
            <div class="column-header left-header" id="leftHeaderTitle">左側直欄</div>
            <div class="cards-side" id="leftCardsContainer"></div>
        </div>

        <!-- 中間時間軸 -->
        <div class="timeline-center" id="timelineCenter">
            <div class="bar-track-container">
                <div class="bar-track" id="leftTrack" style="height: 2750px;"></div>
                <div class="bar-track" id="rightTrack" style="height: 2750px;"></div>
            </div>
        </div>

        <!-- 右側直欄 -->
        <div>
            <div class="column-header right-header" id="rightHeaderTitle">右側直欄</div>
            <div class="cards-side" id="rightCardsContainer"></div>
        </div>
    </div>
</div>

<script>
    const BASE_START_YEAR = 930;
    const TOTAL_YEARS = 344;
    const TRACK_HEIGHT = 2750;

    // 萬能 CSV 解析器 (支援引號內含逗號)
    function parseCSV(text) {
        let lines = text.trim().split('\n');
        let headers = lines[0].split(',').map(h => h.trim());
        let result = [];

        for (let i = 1; i < lines.length; i++) {
            let row = [];
            let inQuotes = false;
            let currentField = '';
            let line = lines[i];

            for (let c = 0; c < line.length; c++) {
                let char = line[c];
                if (char === '"' && (c === 0 || line[c-1] !== '\\')) {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentField.trim().replace(/^["']|["']$/g, ''));
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            row.push(currentField.trim().replace(/^["']|["']$/g, ''));

            let obj = {};
            for (let j = 0; j < headers.length; j++) {
                obj[headers[j]] = row[j] !== undefined ? row[j] : '';
            }
            result.push(obj);
        }
        return result;
    }

    async function initFramework() {
        try {
            // 讀取唯一的通用資料檔案
            const res = await fetch('data_king_cards.csv');
            const csvText = await res.text();
            const rows = parseCSV(csvText);

            // 讀取表頭設定 (取第一筆資料的中繼描述或預設)
            document.getElementById('appTitle').innerText = "✏️ 聖經歷史・萬能呈現框架 (v4.10)";
            document.getElementById('appSubtitle').innerText = "✨ 版面配置、左右側歸屬與年代座標全面由 CSV 錨定控制";
            document.getElementById('leftHeaderTitle').innerText = "北國以色列 (19王全展開)";
            document.getElementById('rightHeaderTitle').innerText = "南國猶大 (20位統治者 + 亡國時期)";

            // 依 CSV 內的 layout_side 與 layout_order 排序
            const leftData = rows.filter(r => r.layout_side === 'left').sort((a,b) => parseInt(a.layout_order) - parseInt(b.layout_order));
            const rightData = rows.filter(r => r.layout_side === 'right').sort((a,b) => parseInt(a.layout_order) - parseInt(b.layout_order));

            renderSide(leftData, 'left', document.getElementById('leftCardsContainer'), document.getElementById('leftTrack'));
            renderSide(rightData, 'right', document.getElementById('rightCardsContainer'), document.getElementById('rightTrack'));

            initInteractive();
            drawLines();
        } catch (e) {
            console.error("無法讀取 CSV 檔案，請確認是否透過 Live Server 等本機伺服器運行：", e);
            alert("載入 CSV 失敗，請確認是否透過本機伺服器 (如 VS Code Live Server)開啟網頁。");
        }
    }

    function renderSide(data, sideName, cardsContainer, trackContainer) {
        data.forEach((item) => {
            const start = parseInt(item.start_year);
            const end = parseInt(item.end_year);
            const uniqueId = `${sideName}-${item.layout_order}`;

            // 建立文字卡片
            const card = document.createElement('div');
            card.className = `king-card side-${sideName}-card tier-${item.justice_tier}`;
            card.setAttribute('data-side', sideName);
            card.setAttribute('data-id', uniqueId);
            card.setAttribute('data-start', start);
            card.setAttribute('data-end', end);

            let fatherLabel = sideName === 'left' && item.layout_order === '4' ? '⚙️ 職務' : (sideName === 'left' && item.layout_order === '5' ? '⚙️ 身分' : '👨 父親');
            let fatherHtml = item.father ? `${fatherLabel}：${item.father}` : '';
            let femaleHtml = item.female_info ? `<span class="female-info">${item.female_info}</span>` : '';
            let middleParts = [fatherHtml, femaleHtml].filter(p => p !== '').join(' | ');
            let middleRowHtml = middleParts ? `<div class="meta-row">${middleParts}</div>` : '';
            let prophetRowHtml = item.prophet ? `<div class="prophet-row">📜 先知：<span class="prophet">${item.prophet}</span></div>` : '';

            card.innerHTML = `
                <div class="king-name">${item.name} (${item.reign_info}, ${item.start_year}-${item.end_year} BC)</div>
                <div class="meta-row">✨ 特質：<span>${item.title_tag}</span></div>
                ${middleRowHtml}
                ${prophetRowHtml}
                <div class="detail-row"><b>核心事件</b>：${item.summary}</div>
            `;
            cardsContainer.appendChild(card);

            // 建立中央色帶區段 (依 start_year / end_year 絕對定位)
            const seg = document.createElement('div');
            seg.className = 'bar-segment';
            seg.setAttribute('data-side', sideName);
            seg.setAttribute('data-id', uniqueId);
            seg.setAttribute('data-start', start);
            seg.setAttribute('data-end', end);

            const topOffset = (BASE_START_YEAR - start) * (TRACK_HEIGHT / TOTAL_YEARS);
            const durationYears = Math.abs(start - end);
            const segHeight = Math.max(durationYears * (TRACK_HEIGHT / TOTAL_YEARS), 4);

            seg.style.top = `${topOffset}px`;
            seg.style.height = `${segHeight}px`;

            if(item.justice_tier === 'good') seg.style.background = 'linear-gradient(to bottom, #52be80, #27ae60)';
            else if(item.justice_tier === 'bad') seg.style.background = 'linear-gradient(to bottom, #d98880, #c0392b)';
            else if(item.justice_tier === 'evil') seg.style.background = '#f5b7b1';
            else if(item.justice_tier === 'special') seg.style.background = 'linear-gradient(to bottom, #f9e79f, #f1c40f)';
            else if(item.justice_tier === 'collapse') seg.style.background = '#641e16';
            else seg.style.background = sideName === 'left' ? '#c0392b' : '#27ae60';

            trackContainer.appendChild(seg);
        });
    }

    function drawLines(activeSide = null, activeId = null, overlapSet = new Set()) {
        const container = document.getElementById('layoutContainer').getBoundingClientRect();
        const svg = document.getElementById('linkSvg');
        
        while (svg.childNodes.length > 0) {
            svg.removeChild(svg.lastChild);
        }

        ['left', 'right'].forEach(side => {
            document.querySelectorAll(`#${side}CardsContainer .king-card`).forEach(card => {
                const id = card.getAttribute('data-id');
                const segment = document.querySelector(`#${side}Track .bar-segment[data-side="${side}"][data-id="${id}"]`);
                if (segment) {
                    const cardRect = card.getBoundingClientRect();
                    const segRect = segment.getBoundingClientRect();

                    const x1 = side === 'left' ? (cardRect.right - container.left) : (cardRect.left - container.left);
                    const y1 = cardRect.top + cardRect.height / 2 - container.top;
                    const x2 = side === 'left' ? (segRect.left - container.left) : (segRect.right - container.left);
                    const y2 = segRect.top + segRect.height / 2 - container.top;

                    const isMain = (activeSide === side && activeId === id);
                    const isOverlap = overlapSet.has(id);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
                    
                    if (isMain) {
                        path.setAttribute('stroke', '#b9770e');
                        path.setAttribute('stroke-width', '3');
                        path.setAttribute('opacity', '1');
                    } else if (isOverlap) {
                        path.setAttribute('stroke', '#f39c12');
                        path.setAttribute('stroke-width', '2');
                        path.setAttribute('opacity', '0.95');
                    } else {
                        path.setAttribute('stroke', side === 'left' ? '#e74c3c' : '#27ae60');
                        path.setAttribute('stroke-width', '1.2');
                        path.setAttribute('opacity', '0.8');
                    }
                    svg.appendChild(path);
                }
            });
        });
    }

    function triggerHighlight(start, end, mainSide, mainId) {
        document.querySelectorAll('.highlight-main, .highlight-overlap').forEach(el => {
            el.classList.remove('highlight-main', 'highlight-overlap');
        });

        const mainCard = document.querySelector(`.king-card[data-side="${mainSide}"][data-id="${mainId}"]`);
        const mainSeg = document.querySelector(`.bar-segment[data-side="${mainSide}"][data-id="${mainId}"]`);
        if (mainCard) mainCard.classList.add('highlight-main');
        if (mainSeg) mainSeg.classList.add('highlight-main');

        const overlapSet = new Set();
        document.querySelectorAll('.king-card').forEach(card => {
            const cSide = card.getAttribute('data-side');
            const cId = card.getAttribute('data-id');

            if (cSide === mainSide) return;

            const cStart = parseInt(card.getAttribute('data-start'));
            const cEnd = parseInt(card.getAttribute('data-end'));

            const maxEnd = Math.max(end, cEnd);
            const minStart = Math.min(start, cStart);

            if (maxEnd <= minStart) {
                card.classList.add('highlight-overlap');
                const seg = document.querySelector(`.bar-segment[data-side="${cSide}"][data-id="${cId}"]`);
                if (seg) seg.classList.add('highlight-overlap');
                overlapSet.add(cId);
            }
        });

        drawLines(mainSide, mainId, overlapSet);
    }

    function initInteractive() {
        document.querySelectorAll('.king-card, .bar-segment').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const start = parseInt(el.getAttribute('data-start'));
                const end = parseInt(el.getAttribute('data-end'));
                const side = el.getAttribute('data-side');
                const id = el.getAttribute('data-id');
                triggerHighlight(start, end, side, id);
            });
        });
    }

    window.addEventListener('load', () => initFramework());
    window.addEventListener('resize', () => drawLines());
</script>

</body>
</html>
