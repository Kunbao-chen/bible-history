<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經南北王國・全 39 位君王獨立對照筆記圖 v2.4</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --north-color: #f97316; /* 北國：橙色系 */
            --north-glow: rgba(249, 115, 22, 0.4);
            --south-color: #38bdf8; /* 南國：藍色系 */
            --south-glow: rgba(56, 189, 248, 0.4);
            
            --highlight-color: #eab308; /* 點擊連動：黃金光芒 */
            --highlight-glow: rgba(234, 179, 8, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .kingdom-column {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .kingdom-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .kingdom-title.north { border-color: var(--north-color); color: var(--north-color); }
        .kingdom-title.south { border-color: var(--south-color); color: var(--south-color); }

        .king-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .king-card {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .king-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-1px);
        }

        /* 點擊後的高亮互動狀態 */
        .king-card.active-target {
            border-color: var(--highlight-color);
            box-shadow: 0 0 12px var(--highlight-glow);
            background-color: rgba(234, 179, 8, 0.1);
        }

        .king-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .king-name {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .king-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .king-years {
            font-family: monospace;
            font-size: 0.9rem;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 色段標記 */
        .king-card.north-side .king-name { color: var(--north-color); }
        .king-card.south-side .king-name { color: var(--south-color); }

        .controls {
            text-align: center;
            margin-top: 20px;
        }

        button.reset-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        button.reset-btn:hover {
            background-color: var(--text-muted);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>聖經南北王國・全 39 位君王獨立對照筆記圖</h1>
        <p>點擊任意君王卡片，將精確連動並點亮跨王國年份重疊對象（v2.4 邏輯優化版）</p>
    </header>

    <div class="container">
        <!-- 北國區塊 -->
        <div class="kingdom-column">
            <div class="kingdom-title north">
                <span>以色列（北國）</span>
                <span style="font-size: 0.85rem; font-weight: normal;">19 位君王</span>
            </div>
            <div class="king-list" id="north-list">
                <!-- 動態生成北國君王 -->
            </div>
        </div>

        <!-- 南國區塊 -->
        <div class="kingdom-column">
            <div class="kingdom-title south">
                <span>猶大（南國）</span>
                <span style="font-size: 0.85rem; font-weight: normal;">20 位君王（含女王）</span>
            </div>
            <div class="king-list" id="south-list">
                <!-- 動態生成南國君王 -->
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="reset-btn" onclick="resetHighlight()">清除選取狀態</button>
    </div>

    <script>
        // 39位君王完整資料庫 (包含名稱、王國、在位起始年、結束年、以及代表性備註)
        const kingsData = [
            // 北國 (19位)
            { id: "n1", name: "耶羅波安一世", kingdom: "north", start: 931, end: 910, note: "金牛犢事件" },
            { id: "n2", name: "拿答", kingdom: "north", start: 910, end: 909, note: "耶羅波安之子" },
            { id: "n3", name: "巴沙", kingdom: "north", start: 909, end: 886, note: "篡位建立新勢力" },
            { id: "n4", name: "以拉", kingdom: "north", start: 886, end: 885, note: "被心利殺害" },
            { id: "n5", name: "心利", kingdom: "north", start: 885, end: 885, note: "在位僅7天" },
            { id: "n6", name: "暗利", kingdom: "north", start: 885, end: 874, note: "定都撒瑪利亞" },
            { id: "n7", name: "亞哈", kingdom: "north", start: 874, end: 853, note: "娶耶洗別，對抗以利亞" },
            { id: "n8", name: "亞哈謝", kingdom: "north", start: 853, end: 852, note: "跌傷致死" },
            { id: "n9", name: "約蘭", kingdom: "north", start: 852, end: 841, note: "被耶戶所殺" },
            { id: "n10", name: "耶戶", kingdom: "north", start: 841, end: 814, note: "血洗亞哈家" },
            { id: "n11", name: "約哈斯", kingdom: "north", start: 814, end: 798, note: "受亞蘭欺壓" },
            { id: "n12", name: "約阿施 (北)", kingdom: "north", start: 798, end: 782, note: "擊敗亞瑪謝" },
            { id: "n13", name: "耶羅波安二世", kingdom: "north", start: 782, end: 753, note: "北國極盛時期" },
            { id: "n14", name: "撒迦利亞", kingdom: "north", start: 753, end: 752, note: "在位6個月" },
            { id: "n15", name: "沙龍", kingdom: "north", start: 752, end: 752, note: "在位1個月" },
            { id: "n16", name: "米拿現", kingdom: "north", start: 752, end: 742, note: "殘暴苛政" },
            { id: "n17", name: "比加轄", kingdom: "north", start: 742, end: 740, note: "被比加殺害" },
            { id: "n18", name: "比加", kingdom: "north", start: 740, end: 732, note: "亞述入侵奪地" },
            { id: "n19", name: "何細亞", kingdom: "north", start: 732, end: 722, note: "北國亡國之君" },

            // 南國 (20位)
            { id: "s1", name: "羅波安", kingdom: "south", start: 931, end: 913, note: "所羅門之子" },
            { id: "s2", name: "亞比央", kingdom: "south", start: 913, end: 911, note: "與北國爭戰" },
            { id: "s3", name: "亞撒", kingdom: "south", start: 911, end: 870, note: "宗教改革" },
            { id: "s4", name: "約沙法", kingdom: "south", start: 870, end: 848, note: "與亞哈結盟" },
            { id: "s5", name: "約蘭 (南)", kingdom: "south", start: 848, end: 841, note: "娶亞哈女兒亞她利雅" },
            { id: "s6", name: "亞哈謝 (南)", kingdom: "south", start: 841, end: 841, note: "被耶戶所殺" },
            { id: "s7", name: "亞她利雅", kingdom: "south", start: 841, end: 835, note: "篡位為王（女王）" },
            { id: "s8", name: "約阿施 (南)", kingdom: "south", start: 835, end: 796, note: "耶何耶大扶持" },
            { id: "s9", name: "亞瑪謝", kingdom: "south", start: 796, end: 767, note: "擊敗以東後驕傲" },
            { id: "s10", name: "烏西雅 (亞撒利雅)", kingdom: "south", start: 767, end: 740, note: "長壽強盛" },
            { id: "s11", name: "約坦", kingdom: "south", start: 740, end: 732, note: "行耶和華眼中看為正的事" },
            { id: "s12", name: "亞哈斯", kingdom: "south", start: 732, end: 716, note: "投降亞述" },
            { id: "s13", name: "希西家", kingdom: "south", start: 716, end: 687, note: "度過亞述危機" },
            { id: "s14", name: "瑪拿西", kingdom: "south", start: 687, end: 642, note: "在位最久、作惡極大" },
            { id: "s15", name: "亞們", kingdom: "south", start: 642, end: 640, note: "臣僕背叛被殺" },
            { id: "s16", name: "約西亞", kingdom: "south", start: 640, end: 609, note: "最後的大復興" },
            { id: "s17", name: "約哈斯 (南)", kingdom: "south", start: 609, end: 609, note: "在位3個月被擄" },
            { id: "s18", name: "約雅敬", kingdom: "south", start: 609, end: 598, note: "受巴比倫控制" },
            { id: "s19", name: "約雅斤", kingdom: "south", start: 598, end: 598, note: "在位3個月被擄" },
            { id: "s20", name: "西底家", kingdom: "south", start: 598, end: 586, note: "南國亡國之君" }
        ];

        // 初始化渲染介面
        function renderKings() {
            const northList = document.getElementById('north-list');
            const southList = document.getElementById('south-list');

            northList.innerHTML = '';
            southList.innerHTML = '';

            kingsData.forEach(king => {
                const card = document.createElement('div');
                card.className = `king-card ${king.kingdom}-side`;
                card.setAttribute('data-id', king.id);
                card.setAttribute('data-kingdom', king.kingdom);
                card.setAttribute('data-start', king.start);
                card.setAttribute('data-end', king.end);

                card.innerHTML = `
                    <div class="king-info">
                        <span class="king-name">${king.name}</span>
                        <span class="king-meta">${king.note}</span>
                    </div>
                    <div class="king-years">BC ${king.start} - ${king.end}</div>
                `;

                // 綁定點擊事件（依 v2.4 步驟執行）
                card.addEventListener('click', () => handleKingClick(king));

                if (king.kingdom === 'north') {
                    northList.appendChild(card);
                } else {
                    southList.appendChild(card);
                }
            });
        }

        // v2.4 核心邏輯：點擊判斷步驟
        function handleKingClick(selectedKing) {
            // 步驟 1：確認點擊卡片色段，確認所屬王國與年份
            const targetKingdom = selectedKing.kingdom;
            const targetStart = selectedKing.start;
            const targetEnd = selectedKing.end;

            // 清除先前所有高亮狀態
            document.querySelectorAll('.king-card').forEach(c => {
                c.classList.remove('active-target');
            });

            // 將當前點擊的卡片點亮
            const currentCard = document.querySelector(`[data-id="${selectedKing.id}"]`);
            if (currentCard) {
                currentCard.classList.add('active-target');
            }

            // 步驟 2 & 3：全域搜尋年份重疊者，並「嚴格剔除同國的」
            kingsData.forEach(king => {
                // 若為同國君王，直接跳過（不點亮）
                if (king.kingdom === targetKingdom) return;

                // 判斷年份是否重疊：(StartA <= EndB) 且 (EndA >= StartB)
                const isOverlap = (targetStart >= king.end) && (targetEnd <= king.start);
                // 由於年份為 BC（倒數計算），正確的區間交集公式為：
                // 兩段時間 [start1, end1] 與 [start2, end2] 重疊條件：Math.max(start1, start2) >= Math.min(end1, end2)
                // 這裡簡化為直覺的 BC 年份判定：
                const overlap = (targetStart >= king.end && targetEnd <= king.start); 
                // 註：在位期間重疊邏輯 (Max(start) >= Min(end)) -> 這裡採用標準交集判定：
                const hasOverlap = Math.max(targetStart, king.start) >= Math.min(targetEnd, king.end);

                if (hasOverlap) {
                    const targetCard = document.querySelector(`[data-id="${king.id}"]`);
                    if (targetCard) {
                        targetCard.classList.add('active-target');
                    }
                }
            });
        }

        // 清除高亮
        function resetHighlight() {
            document.querySelectorAll('.king-card').forEach(c => {
                c.classList.remove('active-target');
            });
        }

        // 頁面載入後自動渲染
        window.addEventListener('DOMContentLoaded', renderKings);
    </script>
</body>
</html>
