<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>聖經歷史・萬能呈現框架 (v4.53 跨界主幹分岔支援版)</title>
    <style>
        @page { size: A4 portrait; margin: 4mm; }
        body { font-family: "Noto Sans TC", Arial, sans-serif; background: #fffdf9; color: #2c3e50; margin: 0; padding: 8px; font-size: 10pt; box-sizing: border-box; }
        .notebook-container { width: 1050px; margin: 0 auto; border: 2px dashed #d4ac0d; padding: 12px 8px; background: #fffbf0; border-radius: 6px; box-sizing: border-box; }
        
        h1 { text-align: center; font-size: 14pt; margin: 0 0 2px 0; background: #f9e79f; color: #7d6608; padding: 3px; border-radius: 4px; }
        p.subtitle { text-align: center; font-size: 10pt; margin: 0 0 10px 0; color: #7f8c8d; }

        .main-layout { display: grid; grid-template-columns: 420px 100px 420px; justify-content: center; gap: 20px; align-items: start; position: relative; }
        
        .column-header { text-align: center; font-weight: bold; padding: 6px; border-radius: 3px; font-size: 11pt; color: white; margin-bottom: 6px; }
        .left-header { background: #e74c3c; }
        .right-header { background: #27ae60; }

        .cards-side { display: flex; flex-direction: column; gap: 6px; position: relative; }

        .king-card {
            background: #ffffff; border: 1px solid #bdc3c7; border-radius: 3px;
            padding: 6px 8px; font-size: 10pt; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            line-height: 1.35; position: relative; cursor: pointer;
            transition: all 0.2s ease;
        }
        .side-left-card { border-left: 4px solid #e74c3c; }
        .side-right-card { border-left: 4px solid #27ae60; }
        
        .king-card.tier-good { background: #eafaf1; }
        .king-card.tier-bad { background: #fdfefe; }
        .king-card.tier-evil { background: #fadbd8; border-left-color: #c0392b; }
        .king-card.tier-special { background: #fef9e7; border-left-color: #f1c40f; }
        .king-card.tier-collapse { background: #4a1512; color: #f5b7b1; border-left-color: #e74c3c; }

        .king-card.highlight-main {
            border: 2px solid #b9770e !important;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.6);
            transform: scale(1.01);
            z-index: 20;
        }
        .king-card.highlight-overlap {
            border: 2px solid #d35400 !important;
            box-shadow: 0 0 8px rgba(211, 84, 0, 0.4);
            z-index: 19;
        }

        .card-title { font-weight: bold; font-size: 10.5pt; color: #2c3e50; border-bottom: 1px solid #ecf0f1; padding-bottom: 2px; margin-bottom: 3px; }
        .tier-collapse .card-title { color: #f5b7b1; border-bottom-color: #641e16; }
        .detail-row { margin-bottom: 2px; display: flex; flex-wrap: wrap; gap: 4px; }
        .tag { background: #f2f4f4; padding: 1px 4px; border-radius: 2px; font-size: 9pt; color: #34495e; }
        .scripture-link { color: #2980b9; text-decoration: none; border-bottom: 1px dotted #2980b9; cursor: pointer; }
        .scripture-link:hover { color: #154360; background: #ebf5fb; }

        .timeline-center { display: flex; flex-direction: column; align-items: center; position: relative; }
        .timeline-scale { font-size: 8.5pt; color: #7f8c8d; text-align: center; margin-bottom: 4px; font-weight: bold; }
        
        .bar-track-container { display: flex; gap: 6px; width: 100%; justify-content: center; position: relative; height: 100%; }
        .bar-track { width: 24px; background: #f4f6f7; border: 1px solid #95a5a6; display: flex; flex-direction: column; position: relative; }
        
        /* 跨界主幹／分岔圖層支援 */
        .cross-track-layer { position: absolute; top: 0; left: -15px; right: -15px; height: 100%; pointer-events: none; z-index: 5; }
        
        .bar-segment {
            position: absolute; left: 0; width: 100%; border-bottom: 1px solid rgba(0,0,0,0.2); box-sizing: border-box; 
            transition: all 0.2s ease; cursor: pointer;
        }
        .bar-segment.highlight-main {
            border: 2px solid #b9770e !important;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.8);
            z-index: 25;
        }
        .bar-segment.highlight-overlap {
            border: 2px solid #d35400 !important;
            box-shadow: 0 0 8px rgba(211, 84, 0, 0.5);
            z-index: 24;
        }

        /* 支援跨軌道／分岔軀幹樣式 */
        .bar-segment.cross-trunk {
            left: -15px !important;
            width: 54px !important;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 12;
        }

        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #scripture-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3000; background: rgba(0,0,0,0.5); }
        .modal-content { position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; background: white; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { background: #2c3e50; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #scripture-frame { flex: 1; border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

<div class="notebook-container">
    <h1 id="appTitle">載入中...</h1>
    <p class="subtitle" id="appSubtitle">✨ v4.53 跨界主幹分岔支援版</p>

    <div class="main-layout" id="layoutContainer">
        <svg class="svg-overlay" id="linkSvg"></svg>

        <div>
            <div class="column-header left-header" id="leftHeaderTitle">左側直欄</div>
            <div class="cards-side" id="leftCardsContainer"></div>
        </div>

        <div class="timeline-center" id="timelineCenter">
            <div class="timeline-scale" id="timelineScaleText">時間軸</div>
            <div class="bar-track-container" id="barTrackContainer">
                <div class="bar-track" id="leftTrack"></div>
                <div class="bar-track" id="rightTrack"></div>
                <div class="cross-track-layer" id="crossTrackLayer"></div>
            </div>
        </div>

        <div>
            <div class="column-header right-header" id="rightHeaderTitle">右側直欄</div>
            <div class="cards-side" id="rightCardsContainer"></div>
        </div>
    </div>
</div>

<div id="scripture-modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modal-title">經文閱讀</span>
            <span style="cursor:pointer; font-weight:bold; font-size:16pt;" onclick="closeScripture()">×</span>
        </div>
        <iframe id="scripture-frame" src=""></iframe>
    </div>
</div>

<script>
    function openScripture(url) {
        document.getElementById('scripture-frame').src = url;
        document.getElementById('scripture-modal').style.display = 'block';
    }
    function closeScripture() {
        document.getElementById('scripture-modal').style.display = 'none';
        document.getElementById('scripture-frame').src = '';
    }

    async function loadData() {
        try {
            const response = await fetch('data_king_cards_4.csv');
            const csvText = await response.text();
            parseAndRender(csvText);
        } catch (e) {
            console.error('載入 CSV 失敗，嘗試 fallback:', e);
        }
    }

    function parseCSV(text) {
        let lines = [];
        let row = [''];
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i+1];
            if (c === '"') {
                if (inQuotes && nextC === '"') { row[row.length - 1] += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
                row.push('');
            } else if ((c === '\r' && nextC === '\n') || (c === '\n' && !inQuotes)) {
                if (c === '\r') i++;
                lines.push(row);
                row = [''];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== '') lines.push(row);
        return lines;
    }

    function parseAndRender(csvText) {
        const rows = parseCSV(csvText);
        if (rows.length < 2) return;
        const headers = rows[0];
        const dataRows = rows.slice(1);

        const data = dataRows.map(r => {
            let obj = {};
            headers.forEach((h, idx) => { obj[h] = r[idx] || ''; });
            return obj;
        });

        const meta = data.find(d => d.type === 'meta') || {};
        document.getElementById('appTitle').innerText = meta.app_title || '聖經歷史對照表';
        document.getElementById('leftHeaderTitle').innerText = meta.left_header || '左側直欄';
        document.getElementById('rightHeaderTitle').innerText = meta.right_header || '右側直欄';

        const cardsData = data.filter(d => d.type === 'card');

        const leftData = cardsData.filter(d => d.layout_side === 'left');
        const rightData = cardsData.filter(d => d.layout_side === 'right');
        const crossData = cardsData.filter(d => d.layout_side === 'cross' || d.track_align === 'cross');

        const leftCardsContainer = document.getElementById('leftCardsContainer');
        const rightCardsContainer = document.getElementById('rightCardsContainer');
        const leftTrackEl = document.getElementById('leftTrack');
        const rightTrackEl = document.getElementById('rightTrack');
        const crossTrackLayer = document.getElementById('crossTrackLayer');

        leftCardsContainer.innerHTML = '';
        rightCardsContainer.innerHTML = '';
        leftTrackEl.innerHTML = '';
        rightTrackEl.innerHTML = '';
        crossTrackLayer.innerHTML = '';

        let allYears = [];
        cardsData.forEach(d => {
            let s = parseInt(d.start_year), e = parseInt(d.end_year);
            if (!isNaN(s)) allYears.push(s);
            if (!isNaN(e)) allYears.push(e);
        });

        const topBaseYear = allYears.length ? Math.max(...allYears) + 10 : 1100;
        const bottomBaseYear = allYears.length ? Math.min(...allYears) - 10 : 500;
        const totalSpan = topBaseYear - bottomBaseYear;

        const basePxPerYear = 1.6; 
        const totalHeight = totalSpan * basePxPerYear;

        leftTrackEl.style.height = `${totalHeight}px`;
        rightTrackEl.style.height = `${totalHeight}px`;
        crossTrackLayer.style.height = `${totalHeight}px`;

        document.getElementById('timelineScaleText').innerText = `時間軸 (${topBaseYear} ~ ${bottomBaseYear} BCE)`;

        renderCards(leftData, leftCardsContainer, 'left');
        renderCards(rightData, rightCardsContainer, 'right');

        renderTrackWithGlobalScale(leftData, 'left', leftTrackEl, basePxPerYear, topBaseYear);
        renderTrackWithGlobalScale(rightData, 'right', rightTrackEl, basePxPerYear, topBaseYear);
        renderCrossTrunkSegments(crossData, crossTrackLayer, basePxPerYear, topBaseYear);

        setTimeout(() => {
            const leftH = leftCardsContainer.getBoundingClientRect().height;
            const rightH = rightCardsContainer.getBoundingClientRect().height;
            const targetH = Math.max(leftH, rightH);
            applyGroupCenterAlignment(leftCardsContainer, leftH, targetH);
            applyGroupCenterAlignment(rightCardsContainer, rightH, targetH);
            drawLines();
        }, 50);
    }

    function renderCards(data, container, sideName) {
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = `king-card side-${sideName}-card tier-${item.justice_tier || 'normal'}`;
            card.setAttribute('data-side', sideName);
            card.setAttribute('data-id', `${sideName}-${item.layout_order}`);
            card.setAttribute('data-start', item.start_year);
            card.setAttribute('data-end', item.end_year);

            card.onmouseenter = () => triggerHighlight(parseInt(item.start_year), parseInt(item.end_year), sideName, `${sideName}-${item.layout_order}`);
            card.onmouseleave = () => clearHighlight();

            let titleHtml = `<div class="card-title">${item.layout_order}. ${item.name} (${item.reign_info})</div>`;
            if (item.title_tag) titleHtml += `<div class="tag">${item.title_tag}</div>`;

            let fatherRow = item.father ? `<div class="detail-row"><b>父親</b>：${item.father}</div>` : '';
            let femaleRow = item.female_info ? `<div class="detail-row"><b>母親/後妃</b>：${item.female_info}</div>` : '';
            
            let prophetRowHtml = '';
            if (item.prophet) {
                let pList = item.prophet.split(',').map(p => {
                    let parts = p.split('|');
                    if (parts.length === 2) return `<a class="scripture-link" onclick="openScripture('${parts[1]}')">${parts[0]}</a>`;
                    return p;
                }).join('、');
                prophetRowHtml = `<div class="detail-row"><b>先知/關鍵</b>：${pList}</div>`;
            }

            let summaryHtml = item.summary;
            if (summaryHtml.includes('|')) {
                let parts = summaryHtml.split('|');
                summaryHtml = `<a class="scripture-link" onclick="openScripture('${parts[1]}')">${parts[0]}</a>`;
            }

            card.innerHTML = `
                ${titleHtml}
                ${fatherRow}
                ${femaleRow}
                ${prophetRowHtml}
                <div class="detail-row"><b>核心事件</b>：${summaryHtml}</div>
            `;
            container.appendChild(card);
        });
    }

    function renderTrackWithGlobalScale(data, sideName, trackContainer, basePxPerYear, topBaseYear) {
        trackContainer.innerHTML = '';
        data.forEach((item) => {
            const rawS = parseInt(item.start_year);
            const rawE = parseInt(item.end_year);
            if (isNaN(rawS) || isNaN(rawE)) return;

            const start = Math.max(rawS, rawE);
            const end = Math.min(rawS, rawE);
            const topOffset = (topBaseYear - start) * basePxPerYear;
            const duration = Math.abs(start - end);
            const height = Math.max(duration * basePxPerYear, 4);

            const seg = document.createElement('div');
            seg.className = 'bar-segment';
            seg.setAttribute('data-side', sideName);
            seg.setAttribute('data-id', `${sideName}-${item.layout_order}`);
            seg.setAttribute('data-start', start);
            seg.setAttribute('data-end', end);
            seg.style.top = `${topOffset}px`;
            seg.style.height = `${height}px`;

            const tier = item.justice_tier;
            if(tier === 'good') seg.style.background = 'linear-gradient(to bottom, #52be80, #27ae60)';
            else if(tier === 'bad') seg.style.background = 'linear-gradient(to bottom, #d98880, #c0392b)';
            else if(tier === 'evil') seg.style.background = '#f5b7b1';
            else if(tier === 'special') seg.style.background = 'linear-gradient(to bottom, #f9e79f, #f1c40f)';
            else if(tier === 'collapse') seg.style.background = '#4a1512';
            else seg.style.background = sideName === 'left' ? '#e74c3c' : '#27ae60';

            trackContainer.appendChild(seg);
        });
    }

    function renderCrossTrunkSegments(data, container, basePxPerYear, topBaseYear) {
        data.forEach((item) => {
            const rawS = parseInt(item.start_year);
            const rawE = parseInt(item.end_year);
            if (isNaN(rawS) || isNaN(rawE)) return;

            const start = Math.max(rawS, rawE);
            const end = Math.min(rawS, rawE);
            const topOffset = (topBaseYear - start) * basePxPerYear;
            const duration = Math.abs(start - end);
            const height = Math.max(duration * basePxPerYear, 4);

            const seg = document.createElement('div');
            seg.className = 'bar-segment cross-trunk';
            seg.setAttribute('data-side', 'cross');
            seg.setAttribute('data-id', `cross-${item.layout_order}`);
            seg.setAttribute('data-start', start);
            seg.setAttribute('data-end', end);
            seg.style.top = `${topOffset}px`;
            seg.style.height = `${height}px`;

            const tier = item.justice_tier;
            if(tier === 'special') seg.style.background = 'linear-gradient(to bottom, #f9e79f, #f1c40f)';
            else seg.style.background = 'linear-gradient(to bottom, #e67e22, #d35400)';

            container.appendChild(seg);
        });
    }

    function applyGroupCenterAlignment(cardsContainer, sideCardsHeight, targetHeight) {
        const heightDiff = targetHeight - sideCardsHeight;
        const overallOffset = heightDiff / 2;
        if (Math.abs(overallOffset) > 1) {
            cardsContainer.style.transform = `translateY(${overallOffset}px)`;
        }
    }

    function drawLines(activeSide = null, activeId = null, overlapSet = new Set()) {
        const container = document.getElementById('layoutContainer').getBoundingClientRect();
        const svg = document.getElementById('linkSvg');
        while (svg.childNodes.length > 0) {
            svg.removeChild(svg.lastChild);
        }

        ['left', 'right'].forEach(side => {
            document.querySelectorAll(`#${side}CardsContainer .king-card`).forEach(card => {
                const id = card.getAttribute('data-id');
                const segment = document.querySelector(`.bar-segment[data-side="${side}"][data-id="${id}"]`);
                if (segment) {
                    const cardRect = card.getBoundingClientRect();
                    const segRect = segment.getBoundingClientRect();

                    const x1 = side === 'left' ? (cardRect.right - container.left) : (cardRect.left - container.left);
                    const y1 = cardRect.top + cardRect.height / 2 - container.top;
                    const x2 = side === 'left' ? (segRect.left - container.left) : (segRect.right - container.left);
                    const y2 = segRect.top + segRect.height / 2 - container.top;

                    const isMain = (activeSide === side && activeId === id);
                    const isOverlap = overlapSet.has(id);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
                    
                    if (isMain) {
                        path.setAttribute('stroke', '#b9770e');
                        path.setAttribute('stroke-width', '3');
                        path.setAttribute('opacity', '1');
                    } else if (isOverlap) {
                        path.setAttribute('stroke', '#f39c12');
                        path.setAttribute('stroke-width', '2');
                        path.setAttribute('opacity', '0.95');
                    } else {
                        path.setAttribute('stroke', side === 'left' ? '#e74c3c' : '#27ae60');
                        path.setAttribute('stroke-width', '1.2');
                        path.setAttribute('opacity', '0.8');
                    }
                    svg.appendChild(path);
                }
            });
        });
    }

    function triggerHighlight(start, end, mainSide, mainId) {
        if (isNaN(start) || isNaN(end)) return;
        document.querySelectorAll('.highlight-main, .highlight-overlap').forEach(el => {
            el.classList.remove('highlight-main', 'highlight-overlap');
        });

        const mainCard = document.querySelector(`.king-card[data-side="${mainSide}"][data-id="${mainId}"]`);
        const mainSeg = document.querySelector(`.bar-segment[data-side="${mainSide}"][data-id="${mainId}"]`);
        if (mainCard) mainCard.classList.add('highlight-main');
        if (mainSeg) mainSeg.classList.add('highlight-main');

        const overlapSet = new Set();
        document.querySelectorAll('.king-card').forEach(card => {
            const cSide = card.getAttribute('data-side');
            const cId = card.getAttribute('data-id');
            if (cSide === mainSide) return;

            const cStart = parseInt(card.getAttribute('data-start'));
            const cEnd = parseInt(card.getAttribute('data-end'));
            if (isNaN(cStart) || isNaN(cEnd)) return;

            const maxEnd = Math.max(end, start);
            const minEnd = Math.min(end, start);
            const cMaxEnd = Math.max(cStart, cEnd);
            const cMinEnd = Math.min(cStart, cEnd);

            if (!(maxEnd <= cMinEnd || minEnd >= cMaxEnd)) {
                overlapSet.add(cId);
                card.classList.add('highlight-overlap');
                const oSeg = document.querySelector(`.bar-segment[data-side="${cSide}"][data-id="${cId}"]`);
                if (oSeg) oSeg.classList.add('highlight-overlap');
            }
        });

        drawLines(mainSide, mainId, overlapSet);
    }

    function clearHighlight() {
        document.querySelectorAll('.highlight-main, .highlight-overlap').forEach(el => {
            el.classList.remove('highlight-main', 'highlight-overlap');
        });
        drawLines();
    }

    window.onload = loadData;
</script>
</body>
</html>
